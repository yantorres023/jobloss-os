name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: "3.47.5"

defaults:
  run:
    working-directory: app

jobs:
  checks:
    name: Format, analyze, test, dataset
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Format
        run: dart format --set-exit-if-changed --output=none lib test tool
      - name: Analyze
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Validate rule dataset
        run: dart run tool/validate_dataset.dart
      - name: Release gate (informational — fails until sources are human-reviewed)
        continue-on-error: true
        run: dart run tool/validate_dataset.dart --release

  android:
    name: Android build (APK, debug-signed)
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: jobloss-os-android-apk-not-for-store
          path: app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

  ios:
    name: iOS build (no codesign)
    needs: checks
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter build ios --release --no-codesign
